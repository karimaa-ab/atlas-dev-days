<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATLAS DEV DAYS - INSCRIPTION</title>
</head>
<body>

    <header>

        <div class="logo">

            <img src="assets/logo.svg" alt="Logo des Atlas Dev Days">

            <span >ATLAS DEV DAYS</span>
        </div>

    <nav>

        <ul>

            <li><a href="index.html">ACCUEIL</a></li>

            <li><a href="programme.html">PROGRAMME</a></li>

            <li><a href="intervenants.html">INTERVENANTS</a></li>

        </ul>

    </nav>

    <a href="inscription.html" class="btn-header">S'INSCRIRE</a>
    </header>

    <main>

    <h1>Formulaire</h1>

    <section class="registration-form">

        <form>

            <div class="form-group">

                <label>Nom Complet</label>

                <input type="text" placeholder="Votre nom et prénom" >

            </div>

            <div class="form-group">

                <label>Adresse Email</label>

                <input type="email" placeholder="votre.email@example.com">

            </div>

            <div class="form-group">

                <label>Numéro de téléphone</label>

                <input type="text" placeholder="06XXXXXXXX">

            </div>

            <div class="form-group">

                <label>Choix du Jour</label>

                <select>

                    <option>Les deux jours (5 et 6 Octobre)</option>
                    <option>Jour 1 - 5 octobre</option>
                    <option>Jour 2 - 6 octobre</option>

                </select>

            </div>

            <div class="form-group">

                <input type="checkbox">

                <label>J'accepte les conditions d'utilisation</label>

            </div>

            <button>S'INSCRIRE</button>

        </form>

    </section>

    <section class="info-pratiques">

        <h2>Informations pratiques</h2>

        <p>
            <strong>Lieu :</strong> Casablanca, Maroc
        </p>

        <p>
            <strong>Date :</strong> 5 - 6 Octobre 2026
        </p>

        <p>
            <strong>Contact :</strong> contact@atlasdevdays.ma
        </p>

    </section>

    </main>

    <footer>
        <p>© 2026 Atlas Dev Days - <a href="https://validator.w3.org/">validator W3C</a></p>
    </footer>
